<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="src/styles/styles.css">

    <title>Criar conta</title>
</head>

<body>

    <main id="form_container">

        <!-- Cabeçalho -->
        <div id="form_header">
            <h1 id="form_title">Criar conta</h1>

            <button class="btn-default" type="button">
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </div>

        <!-- Formulário -->
        <form id="form" novalidate>

            <div id="input_container">

                <!-- Primeiro nome -->
                <div class="input-box">
                    <label for="name" class="form-label">
                        Primeiro nome:
                    </label>

                    <div class="input-field">
                        <input type="text" name="name" id="name"
                            class="form-control" placeholder="Elaine">

                        <i class="fa-regular fa-user"></i>
                    </div>

                    <span class="error"></span>
                </div>

                <!-- Último nome -->
                <div class="input-box">
                    <label for="last_name" class="form-label">
                        Último nome:
                    </label>

                    <div class="input-field">
                        <input type="text" name="last_name" id="last_name"
                            class="form-control" placeholder="Neves">

                        <i class="fa-regular fa-user"></i>
                    </div>

                    <span class="error"></span>
                </div>

                <!-- Data de nascimento -->
                <div class="input-box">
                    <label for="birthdate" class="form-label">
                        Data de nascimento:
                    </label>

                    <div class="input-field">
                        <input type="date" name="birthdate"
                            id="birthdate" class="form-control">
                    </div>
                </div>

                <!-- E-mail -->
                <div class="input-box">
                    <label for="email" class="form-label">
                        E-mail:
                    </label>

                    <div class="input-field">
                        <input type="email" name="email" id="email"
                            class="form-control"
                            placeholder="exemplo@gmail.com">

                        <i class="fa-regular fa-envelope"></i>
                    </div>

                    <span class="error"></span>
                </div>

                <!-- Senha -->
                <div class="input-box">
                    <label for="password" class="form-label">
                        Senha:
                    </label>

                    <div class="input-field">
                        <input type="password" name="password"
                            id="password" class="form-control"
                            placeholder="********">

                        <i class="fa-regular fa-eye-slash password-icon"></i>
                    </div>

                    <span class="error"></span>
                </div>

                <!-- Confirmar senha -->
                <div class="input-box">
                    <label for="confirm_password" class="form-label">
                        Confirmar senha:
                    </label>

                    <div class="input-field">
                        <input type="password" name="confirm_password"
                            id="confirm_password" class="form-control"
                            placeholder="********">

                        <i class="fa-regular fa-eye-slash password-icon"></i>
                    </div>

                    <span class="error"></span>
                </div>

                <!-- Gênero -->
                <div class="radio-container">

                    <label class="form-label">Gênero:</label>

                    <div id="gender_inputs">

                        <div class="radio-box">
                            <input type="radio" name="gender"
                                id="female" value="female">

                            <label for="female" class="form-label">
                                Feminino
                            </label>
                        </div>

                        <div class="radio-box">
                            <input type="radio" name="gender"
                                id="male" value="male">

                            <label for="male" class="form-label">
                                Masculino
                            </label>
                        </div>

                        <div class="radio-box">
                            <input type="radio" name="gender"
                                id="other" value="other">

                            <label for="other" class="form-label">
                                Outro
                            </label>
                        </div>

                    </div>

                    <span class="error"></span>

                </div>

                <!-- Botão de enviar -->
                <button type="submit" id="submit_button"
                    class="btn-default">

                    <i class="fa-solid fa-check"></i>
                    Criar minha conta

                </button>

            </div>

        </form>

    </main>

    <script src="./src/styles/javascript/script.js"></script>

</body>
</html>
